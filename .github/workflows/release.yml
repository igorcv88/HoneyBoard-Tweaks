name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: honeyboard-release
  cancel-in-progress: false

env:
  APPLICATION_ID: io.github.igorcv88.honeyboardtweaks
  BUILD_TOOLS_VERSION: '36.0.0'

jobs:
  release:
    if: github.repository == 'igorcv88/HoneyBoard-Tweaks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done

      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Choose next version
        run: |
          set -euo pipefail
          APP_COMMIT="$(git rev-parse HEAD)"
          test "$APP_COMMIT" = "$GITHUB_SHA"
          LAST_PATCH="$(git tag --list 'v0.1.*' | sed -nE 's/^v0\.1\.([0-9]+)$/\1/p' | sort -n | tail -n 1)"
          PATCH=$((10#${LAST_PATCH:-0} + 1))
          VERSION_NAME="0.1.$PATCH"
          VERSION_CODE=$((100 + PATCH))
          {
            echo "APP_COMMIT=$APP_COMMIT"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "RELEASE_TAG=v$VERSION_NAME"
          } >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages (install only when missing)
        run: |
          set -euo pipefail
          # Hosted runners may already provide these SDK packages. Reinstalling
          # them on every dispatch adds work even when Gradle caches are warm.
          PACKAGES=()
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]]; then
            PACKAGES+=('platforms;android-37.0')
          fi
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [[ ! -x "$BUILD_TOOLS_DIR/aapt2" ||
                ! -x "$BUILD_TOOLS_DIR/apksigner" ||
                ! -x "$BUILD_TOOLS_DIR/zipalign" ]]; then
            PACKAGES+=("build-tools;$BUILD_TOOLS_VERSION")
          fi
          if (( ${#PACKAGES[@]} > 0 )); then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "${PACKAGES[@]}" >/dev/null
          else
            echo "Android Platform 37.0 and Build Tools $BUILD_TOOLS_VERSION already installed"
          fi
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$BUILD_TOOLS_DIR/aapt2"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$BUILD_TOOLS_DIR/zipalign"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build release
        run: |
          set -euo pipefail
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            -PreleaseVersionCode="$VERSION_CODE" -PreleaseVersionName="$VERSION_NAME"

      - name: Verify APK identity and module metadata
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          BADGING="$("$BUILD_TOOLS_DIR/aapt2" dump badging "$APK")"
          PACKAGE_LINE="$(head -n 1 <<< "$BADGING")"
          grep -F "package: name='$APPLICATION_ID'" <<< "$PACKAGE_LINE"
          grep -F "versionCode='$VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -F "versionName='$VERSION_NAME'" <<< "$PACKAGE_LINE"
          test "$(unzip -p "$APK" META-INF/xposed/java_init.list)" = 'io.github.igorcv88.honeyboardtweaks.HoneyboardModule'
          test "$(unzip -p "$APK" META-INF/xposed/scope.list)" = 'com.samsung.android.honeyboard'

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/honeyboard-release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          UNSIGNED_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED_APK="$RUNNER_TEMP/honeyboard-aligned.apk"
          RELEASE_ASSET="HoneyBoard-Tweaks-$VERSION_NAME.apk"
          "$BUILD_TOOLS_DIR/zipalign" -P 16 -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RELEASE_ASSET" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 4 "$RELEASE_ASSET"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_ASSET"
          sha256sum "$RELEASE_ASSET" > "$RELEASE_ASSET.sha256"
          echo "RELEASE_ASSET=$RELEASE_ASSET" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          {
            printf 'HoneyBoard Tweaks %s\n\n' "$VERSION_NAME"
            printf 'Source commit: `%s`\n\n' "$APP_COMMIT"
            printf 'LSPosed scope: Samsung Keyboard. Requires libxposed API 102 and the mapped DZIF APK.\n'
          } > "$NOTES_PATH"
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" \
            --target "$APP_COMMIT" --title "HoneyBoard Tweaks $VERSION_NAME" \
            --notes-file "$NOTES_PATH" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/honeyboard-release.keystore"
